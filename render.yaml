services:
  - type: web
    name: studyhub-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: CHROMA_HOST
        value: api.trychroma.com
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        value: StudentHub
      - key: CHROMA_COLLECTION
        value: study_hub_embeddings
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: academic-resources
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
